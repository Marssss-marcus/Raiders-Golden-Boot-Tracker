<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Rockdale Raiders Golden Boot Tracker</title>

<style>
body{
    font-family:Arial;
    background:#0b1d3a;
    color:white;
    text-align:center;
}

h1{
    color:#4da3ff;
}

table{
    margin:auto;
    border-collapse:collapse;
    width:90%;
}

th,td{
    border:1px solid white;
    padding:10px;
}

th{
    background:#1c3f7a;
}

tr:nth-child(even){
    background:#12284d;
}
</style>

</head>

<body>

<h1>Rockdale Raiders Golden Boot Tracker</h1>

<p id="status">Loading...</p>

<table>
<thead>
<tr>
<th>Person</th>
<th>Player</th>
<th>Goals</th>
</tr>
</thead>

<tbody id="board"></tbody>

</table>

<script>

// ==========================
// PUT YOUR API KEY HERE
// ==========================
const API_KEY = "4e3a47f94a4d25a9372ef9e788240186";

// ==========================
// DRAW
// ==========================
const players = [
{name:"Dec",player:"Vinicius Junior",aliases:["Vinicius Jr","Vinicius Jr."]},
{name:"Luka",player:"Raphinha"},
{name:"Zyler",player:"Kai Havertz"},
{name:"Myles",player:"Romelu Lukaku"},
{name:"Galen",player:"Lautaro Martinez"},
{name:"Jayden",player:"Harry Kane"},
{name:"Sam",player:"Erling Haaland"},
{name:"Chanel",player:"Lamine Yamal"},
{name:"George",player:"Julian Alvarez"},
{name:"Rahil",player:"Ousmane Dembele"},
{name:"Daniel",player:"Jude Bellingham"},
{name:"Deon",player:"Alexander Isak"},
{name:"Xavier F",player:"Bukayo Saka"},
{name:"Olive",player:"Luis Diaz"},
{name:"Josh",player:"Mikel Oyarzabal"},
{name:"Pauly",player:"Lionel Messi"},
{name:"Charlie",player:"Cristiano Ronaldo"},
{name:"Riley",player:"Mohamed Salah"},
{name:"Anthony",player:"Marcus Rashford"},
{name:"Anne",player:"Kylian Mbappe"},
{name:"Aiden",player:"Sadio Mane"},
{name:"Ollie",player:"Cody Gakpo"},
{name:"Xavier T",player:"Bruno Fernandes"},
{name:"Marcus",player:"Christian Pulisic"}
];

let goals = {};

function normalizeName(name){
    return name
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase();
}

function getGoalsForPlayer(player){
    const namesToCheck = [player.player, ...(player.aliases ?? [])];

    for(const name of namesToCheck){
        const goalsForName = goals[normalizeName(name)];

        if(goalsForName !== undefined){
            return goalsForName;
        }
    }

    return 0;
}

// ==========================
// UPDATE FUNCTION
// ==========================
async function update(){

    document.getElementById("status").innerText = "Updating...";

    try{

        const response = await fetch(
            "https://v3.football.api-sports.io/players/topscorers?league=1&season=2026",
            {
                headers:{
                    "x-apisports-key": API_KEY
                }
            }
        );

        if(!response.ok){
            throw new Error(`API failed with status ${response.status}`);
        }

        const data = await response.json();

        console.log("API Response:", data);

        goals = {};

        if(data.response){

            data.response.forEach(p => {

                const name = p.player?.name;
                const total = p.statistics?.[0]?.goals?.total ?? 0;

                if(name){
                    goals[normalizeName(name)] = total;
                }

            });

        }

        const tbody = document.getElementById("board");
        tbody.innerHTML = "";

        players.forEach(p => {

            const g = getGoalsForPlayer(p);

            tbody.innerHTML += `
            <tr>
                <td>${p.name}</td>
                <td>${p.player}</td>
                <td>${g}</td>
            </tr>
            `;

        });

        document.getElementById("status").innerText = "Updated OK";

    }

    catch(error){

        console.log("ERROR:", error);

        document.getElementById("status").innerText =
            "API Error - check console";

    }
}

// Run immediately
update();

// Update every 10 minutes
setInterval(update, 600000);

</script>

</body>
</html>
