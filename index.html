<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Rockdale Raiders Golden Boot Tracker</title>

<style>
body{
    font-family:Arial;
    background:#0b1d3a;
    color:white;
    text-align:center;
}

h1{
    color:#4da3ff;
}

table{
    margin:auto;
    border-collapse:collapse;
    width:90%;
}

th,td{
    border:1px solid white;
    padding:10px;
}

th{
    background:#1c3f7a;
}

tr:nth-child(even){
    background:#12284d;
}
</style>

</head>

<body>

<h1>Rockdale Raiders Golden Boot Tracker</h1>

<p id="status">Loading...</p>

<table>
<thead>
<tr>
<th>Person</th>
<th>Player</th>
<th>Goals</th>
</tr>
</thead>

<tbody id="board"></tbody>
</table>

<script>

// ==========================
// DATA SOURCE
// ==========================
const WIKIPEDIA_API_URL =
"https://en.wikipedia.org/w/api.php?action=parse&page=2026_FIFA_World_Cup&prop=text&format=json&origin=*";

// ==========================
// DRAW
// ==========================
const players = [
{name:"Dec",player:"Vinicius Junior",aliases:["Vinicius","Vinícius","Vinícius Júnior","Vinicius Jr","Vinicius Jr."]},
{name:"Luka",player:"Raphinha"},
{name:"Zyler",player:"Kai Havertz"},
{name:"Myles",player:"Romelu Lukaku"},
{name:"Galen",player:"Lautaro Martinez"},
{name:"Jayden",player:"Harry Kane"},
{name:"Sam",player:"Erling Haaland"},
{name:"Chanel",player:"Lamine Yamal"},
{name:"George",player:"Julian Alvarez"},
{name:"Rahil",player:"Ousmane Dembele"},
{name:"Daniel",player:"Jude Bellingham"},
{name:"Deon",player:"Alexander Isak"},
{name:"Xavier F",player:"Bukayo Saka"},
{name:"Olive",player:"Luis Diaz"},
{name:"Josh",player:"Mikel Oyarzabal"},
{name:"Pauly",player:"Lionel Messi"},
{name:"Charlie",player:"Cristiano Ronaldo"},
{name:"Riley",player:"Mohamed Salah"},
{name:"Anthony",player:"Marcus Rashford"},
{name:"Anne",player:"Kylian Mbappe"},
{name:"Aiden",player:"Sadio Mane"},
{name:"Ollie",player:"Cody Gakpo"},
{name:"Xavier T",player:"Bruno Fernandes"},
{name:"Marcus",player:"Christian Pulisic"}
];

let goals = {};

// ==========================
// HELPERS
// ==========================
function normalizeName(name){
return name
.normalize("NFD")
.replace(/[\u0300-\u036f]/g, "")
.toLowerCase();
}

function addGoal(name){
const normalized = normalizeName(name);
goals[normalized] = (goals[normalized] ?? 0) + 1;
}

function getGoalsForPlayer(player){
const namesToCheck = [player.player, ...(player.aliases ?? [])];

for(const name of namesToCheck){
const normalized = normalizeName(name);
if(goals[normalized] !== undefined){
return goals[normalized];
}
}
return 0;
}

function getScorerName(goalItem){
const link = goalItem.querySelector("a[title]");
if(link) return link.getAttribute("title");
return goalItem.textContent.split("\n")[0].trim();
}

function countGoalsFromWikipedia(html){
const page = new DOMParser().parseFromString(html, "text/html");

goals = {};

console.log(page.querySelectorAll(".fgoals li").length);

page.querySelectorAll(".fgoals li").forEach(goalItem => {
const isGoal = goalItem.querySelector(".fb-goal");
const isOwnGoal = goalItem.textContent.includes("o.g.");

if(isGoal && !isOwnGoal){
addGoal(getScorerName(goalItem));
}
});
}

function buildRows(){
    return players
        .map(p => ({
            person: p.name,
            player: p.player,
            goals: getGoalsForPlayer(p)
        }))
        .sort((a, b) => {
            // Higher goals first
            if (b.goals !== a.goals){
                return b.goals - a.goals;
            }

            // If tied, sort alphabetically by person's name
            return a.person.localeCompare(b.person);
        });
}

function drawRows(rows){
const tbody = document.getElementById("board");
tbody.innerHTML = "";

rows.forEach(row => {
tbody.innerHTML += `
<tr>
<td>${row.person}</td>
<td>${row.player}</td>
<td>${row.goals}</td>
</tr>
`;
});
}

// ==========================
// UPDATE FUNCTION
// ==========================
async function update(){

document.getElementById("status").innerText = "Updating...";

try{

const response = await fetch(WIKIPEDIA_API_URL);

if(!response.ok){
throw new Error(`Wikipedia API failed with status ${response.status}`);
}

const data = await response.json();

if(!data.parse?.text?.["*"]){
throw new Error("Wikipedia data did not include the page HTML");
}

countGoalsFromWikipedia(data.parse.text["*"]);

console.log(goals);

const latestRows = buildRows();
drawRows(latestRows);

const now = new Date();
const updateLabel =
`${now.toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"})} ${now.toLocaleDateString([], {day:"numeric", month:"numeric"})}`;

document.getElementById("status").innerText =
`Last updated ${updateLabel}`;

}

catch(error){
console.log("ERROR:", error);
document.getElementById("status").innerText =
"Update error - check console";
}
}

// Run immediately
update();

// Update every 10 minutes
setInterval(update, 600000);

</script>

</body>
</html>
