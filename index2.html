<!DOCTYPE html>
<html>
<head>
<title>Rockdale Raiders Golden Boot Tracker</title>

<style>
body{
    font-family:Arial;
    background:#0b1d3a;
    color:white;
    text-align:center;
}

h1{
    color:#4da3ff;
}

table{
    margin:auto;
    border-collapse:collapse;
    width:90%;
}

th,td{
    border:1px solid white;
    padding:10px;
}

th{
    background:#1c3f7a;
}

tr:nth-child(even){
    background:#12284d;
}
</style>

</head>

<body>

<h1> Rockdale Raiders Golden Boot Tracker</h1>

<p id="status">Loading...</p>

<table>
<thead>
<tr>
<th>Person</th>
<th>Player</th>
<th>Goals</th>
</tr>
</thead>

<tbody id="board"></tbody>

</table>

<script>

// ==========================
// PUT YOUR API KEY HERE
// ==========================
const API_KEY = "4e3a47f94a4d25a9372ef9e788240186";

// ==========================
// DRAW
// ==========================
const players = [
{name:"Dec",player:"Vinícius Júnior"},
{name:"Luka",player:"Raphinha"},
{name:"Zyler",player:"Kai Havertz"},
{name:"Myles",player:"Romelu Lukaku"},
{name:"Galen",player:"Lautaro Martínez"},
{name:"Jayden",player:"Harry Kane"},
{name:"Sam",player:"Erling Haaland"},
{name:"Chanel",player:"Lamine Yamal"},
{name:"George",player:"Julián Álvarez"},
{name:"Rahil",player:"Ousmane Dembélé"},
{name:"Daniel",player:"Jude Bellingham"},
{name:"Deon",player:"Alexander Isak"},
{name:"Xavier F",player:"Bukayo Saka"},
{name:"Olive",player:"Luis Díaz"},
{name:"Josh",player:"Mikel Oyarzabal"},
{name:"Pauly",player:"Lionel Messi"},
{name:"Charlie",player:"Cristiano Ronaldo"},
{name:"Riley",player:"Mohamed Salah"},
{name:"Anthony",player:"Marcus Rashford"},
{name:"Anne",player:"Kylian Mbappé"},
{name:"Aiden",player:"Sadio Mané"},
{name:"Ollie",player:"Cody Gakpo"},
{name:"Xavier T",player:"Bruno Fernandes"},
{name:"Marcus",player:"Christian Pulisic"}
];

// ==========================
// UPDATE FUNCTION
// ==========================
async function update(){

    document.getElementById("status").innerText =
        "Updating...";

    try{

        const response = await fetch(
            "https://v3.football.api-sports.io/players/topscorers?league=1&season=2026",
            {
                headers:{
                    "x-apisports-key":API_KEY
                }
            }
        );

        const data = await response.json();

        console.log("API Response:",data);

        let goals = {};

        if(data.response){

            data.response.forEach(p=>{

                goals[p.player.name] =
                    p.statistics[0].goals.total;

            });

        }

        const tbody = document.getElementById("board");

        tbody.innerHTML = "";

        players.forEach(p=>{

            tbody.innerHTML += `
            <tr>
                <td>${p.name}</td>
                <td>${p.player}</td>
                <td>${goals[p.player] || 0}</td>
            </tr>
            `;

        });

        document.getElementById("status").innerText =
            "Updated ✔";

    }

    catch(error){

        console.log("ERROR:",error);

        document.getElementById("status").innerText =
            "API Error - Press F12 and open Console";

    }

}

// Run immediately
update();

// Update every 10 minutes
setInterval(update,600000);

</script>

</body>
</html>
